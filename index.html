<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ELEMELEC Quiz #4 Study Timing Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-canvas: #FAF8F5;
      --card-white: #FFFFFF;
      --border-subtle: #E8E2DA;
      --text-main: #2D2735;
      --text-muted: #827A8C;

      --header-bg: #F4EFEB;
      --header-text: #6A6070;
      --weekend-text: #8C7B70;

      --day-bg: #FCFBF9;
      --day-hover-border: #BAE6FD;

      --review-active-bg: #DBEAFE;
      --review-active-border: #93C5FD;
      --review-active-text: #1E3A8A;

      --quiz-base-bg: #FFF5F7;
      --quiz-active-bg: #FB7185;
      --quiz-active-border: #F43F5E;
      --quiz-active-text: #FFFFFF;

      --pill-none-bg: #F1ECE6;
      --pill-none-text: #6E6575;
      --pill-none-dot: #B6ADC0;

      --pill-cramming-bg: #FFE4E6;
      --pill-cramming-text: #E11D48;
      --pill-cramming-dot: #FB7185;

      --pill-block-bg: #E0F2FE;
      --pill-block-text: #0284C7;
      --pill-block-dot: #38BDF8;

      --pill-spaced-bg: #DCFCE7;
      --pill-spaced-text: #15803D;
      --pill-spaced-dot: #4ADE80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .tracker-card {
      width: 100%;
      max-width: 680px;
      background: var(--card-white);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 16px 45px -12px rgba(90, 75, 65, 0.08),
                  0 2px 6px -1px rgba(90, 75, 65, 0.02);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .course-badge {
      display: inline-block;
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #BFDBFE;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }

    .title-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .title-section h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-main);
      line-height: 1.25;
    }

    .title-section p {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 500;
      max-width: 500px;
      line-height: 1.5;
    }

    /* Step Selector Tabs */
    .step-switch {
      display: flex;
      background: #F4EFEB;
      padding: 4px;
      border-radius: 999px;
      gap: 6px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 440px;
    }

    .step-tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .step-tab.active {
      background: #FFFFFF;
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .step-tab.step-quiz.active {
      color: #E11D48;
    }

    .step-tab.step-review.active {
      color: #0284C7;
    }

    /* Month Navigation Header */
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .calendar-nav h2 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .nav-btn {
      background: #FFFFFF;
      border: 1.5px solid var(--border-subtle);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--header-bg);
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Calendar Grid */
    .calendar-container {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-name {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--header-text);
      padding: 6px 0;
    }

    .day-name.weekend {
      color: var(--weekend-text);
    }

    .cal-cell {
      background: var(--day-bg);
      border: 1.5px solid var(--border-subtle);
      border-radius: 12px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .cal-cell.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
      pointer-events: none;
    }

    .cal-cell:hover:not(.empty):not(.disabled) {
      border-color: var(--day-hover-border);
      background: #F0F7FF;
      transform: translateY(-2px);
    }

    .cal-cell.disabled {
      background: #F3EFEA;
      border-color: #E2DBD2;
      color: #BBB1A6;
      cursor: not-allowed;
      opacity: 0.45;
      box-shadow: none;
    }

    .cal-cell.disabled:hover {
      transform: none;
      background: #F3EFEA;
      border-color: #E2DBD2;
    }

    .cal-cell.is-quiz {
      background: var(--quiz-active-bg) !important;
      border-color: var(--quiz-active-border) !important;
      color: var(--quiz-active-text) !important;
      box-shadow: 0 6px 14px -3px rgba(251, 113, 133, 0.45);
    }

    .cal-cell .cell-badge {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 3px;
      padding: 2px 5px;
      border-radius: 999px;
    }

    .cal-cell.is-quiz .cell-badge {
      background: rgba(255, 255, 255, 0.28);
      color: #FFFFFF;
    }

    .cal-cell.is-review {
      background: var(--review-active-bg);
      border-color: var(--review-active-border);
      color: var(--review-active-text);
      box-shadow: 0 4px 12px -2px rgba(147, 197, 253, 0.35);
    }

    .cal-cell.is-review .cell-badge {
      background: rgba(30, 58, 138, 0.12);
      color: var(--review-active-text);
    }

    .cal-cell.is-quiz.is-review .cell-badge {
      background: #FFFFFF;
      color: #E11D48;
    }

    /* Status Section */
    .status-section {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      width: 100%;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px -3px rgba(0, 0, 0, 0.04);
    }

    .status-pill .indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-pill.status-none {
      background: var(--pill-none-bg);
      color: var(--pill-none-text);
    }
    .status-pill.status-none .indicator-dot {
      background: var(--pill-none-dot);
    }

    .status-pill.status-cramming {
      background: var(--pill-cramming-bg);
      color: var(--pill-cramming-text);
    }
    .status-pill.status-cramming .indicator-dot {
      background: var(--pill-cramming-dot);
      box-shadow: 0 0 10px var(--pill-cramming-dot);
    }

    .status-pill.status-block {
      background: var(--pill-block-bg);
      color: var(--pill-block-text);
    }
    .status-pill.status-block .indicator-dot {
      background: var(--pill-block-dot);
      box-shadow: 0 0 10px var(--pill-block-dot);
    }

    .status-pill.status-spaced {
      background: var(--pill-spaced-bg);
      color: var(--pill-spaced-text);
    }
    .status-pill.status-spaced .indicator-dot {
      background: var(--pill-spaced-dot);
      box-shadow: 0 0 10px var(--pill-spaced-dot);
    }

    .status-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.5;
      font-weight: 500;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .selected-summary {
      font-size: 0.82rem;
      font-weight: 600;
      color: #9C93A4;
    }

    .survey-btn {
      margin-top: 8px;
      background: #2563EB;
      color: #FFFFFF;
      text-decoration: none;
      padding: 13px 26px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      border: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .survey-btn:hover {
      background: #1D4ED8;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.5);
    }

    .survey-btn:active {
      transform: scale(0.97);
    }

    .survey-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .reset-btn {
      margin-top: 4px;
      background: transparent;
      border: 1.5px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background: var(--header-bg);
      color: var(--text-main);
    }

    @media (max-width: 580px) {
      .tracker-card {
        padding: 24px 16px 28px;
        border-radius: 20px;
      }
      .title-section h1 {
        font-size: 1.4rem;
      }
      .survey-btn {
        width: 100%;
      }
      .cal-cell {
        border-radius: 8px;
        font-size: 0.85rem;
      }
      .cal-cell .cell-badge {
        font-size: 0.52rem;
        padding: 1px 3px;
      }
    }
  </style>
</head>
<body>

  <main class="tracker-card">
    <div class="course-badge">ELEMELEC • Engr. Nikolai</div>

    <header class="title-section">
      <h1>Quiz #4 Study Timing Tracker</h1>
      <p id="instructionText">Step 1: Tap the exact date Quiz #4 was conducted.</p>
    </header>

    <div class="step-switch">
      <button id="tabQuiz" class="step-tab step-quiz active" type="button">
        <span>1. Quiz Date</span>
      </button>
      <button id="tabReview" class="step-tab step-review" type="button">
        <span>2. Review Dates</span>
      </button>
    </div>

    <div class="calendar-nav">
      <button id="prevMonthBtn" class="nav-btn" type="button" aria-label="Previous Month">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 id="currentMonthYear">Month Year</h2>
      <button id="nextMonthBtn" class="nav-btn" type="button" aria-label="Next Month">
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="calendar-container" id="calendarGrid">
      <div class="day-name weekend">Sun</div>
      <div class="day-name">Mon</div>
      <div class="day-name">Tue</div>
      <div class="day-name">Wed</div>
      <div class="day-name">Thu</div>
      <div class="day-name">Fri</div>
      <div class="day-name weekend">Sat</div>
    </div>

    <div class="status-section">
      <div id="statusPill" class="status-pill status-none">
        <span class="indicator-dot"></span>
        <span id="statusLabel">No review</span>
      </div>

      <p id="statusDescription" class="status-description">
        Please select the date Quiz #4 was conducted.
      </p>

      <span id="selectedSummary" class="selected-summary">Quiz date not selected</span>

      <button id="surveyBtn" class="survey-btn" type="button">
        <span>Continue to Survey with my result</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
      </button>

      <button id="resetBtn" class="reset-btn" type="button">
        <span>Reset calendar</span>
      </button>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const calendarGrid = document.getElementById('calendarGrid');
      const monthYearTitle = document.getElementById('currentMonthYear');
      const prevMonthBtn = document.getElementById('prevMonthBtn');
      const nextMonthBtn = document.getElementById('nextMonthBtn');
      const tabQuiz = document.getElementById('tabQuiz');
      const tabReview = document.getElementById('tabReview');
      const instructionText = document.getElementById('instructionText');

      const statusPill = document.getElementById('statusPill');
      const statusLabel = document.getElementById('statusLabel');
      const statusDescription = document.getElementById('statusDescription');
      const selectedSummary = document.getElementById('selectedSummary');
      const surveyBtn = document.getElementById('surveyBtn');
      const resetBtn = document.getElementById('resetBtn');

      const FORM_BASE_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeopXUSNnxjcF5Mo8oV_Q5lU3nTTji55Q9RTD6CORmWIOASmw/viewform?usp=pp_url";
      const ENTRY_ID = "entry.1317088367";

      let viewDate = new Date();
      let activeMode = 'quiz';

      let quizDateStr = null;
      let reviewDateStrs = new Set();
      let currentFormAnswer = 'No+Review';

      const MONTH_NAMES = [
        "January", "February", "March", "April", "May", "June", 
        "July", "August", "September", "October", "November", "December"
      ];

      function formatYMD(year, month, day) {
        const m = String(month + 1).padStart(2, '0');
        const d = String(day).padStart(2, '0');
        return `${year}-${m}-${d}`;
      }

      function parseYMD(dateStr) {
        const parts = dateStr.split('-');
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      }

      function setMode(mode) {
        activeMode = mode;
        if (activeMode === 'quiz') {
          tabQuiz.classList.add('active');
          tabReview.classList.remove('active');
          instructionText.textContent = "Step 1: Tap the exact date Quiz #4 was conducted.";
        } else {
          tabReview.classList.add('active');
          tabQuiz.classList.remove('active');
          instructionText.textContent = "Step 2: Tap the dates you reviewed before Quiz #4.";
        }
        renderCalendar();
      }

      function renderCalendar() {
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        monthYearTitle.textContent = `${MONTH_NAMES[month]} ${year}`;

        while (calendarGrid.children.length > 7) {
          calendarGrid.removeChild(calendarGrid.lastChild);
        }

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = 'cal-cell empty';
          calendarGrid.appendChild(emptyCell);
        }

        const quizDateObj = quizDateStr ? parseYMD(quizDateStr) : null;

        for (let day = 1; day <= totalDays; day++) {
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'cal-cell';
          const thisDateStr = formatYMD(year, month, day);
          const thisDateObj = new Date(year, month, day);

          const isQuiz = (quizDateStr === thisDateStr);
          const isReview = reviewDateStrs.has(thisDateStr);
          const isAfterQuiz = quizDateObj && (thisDateObj.getTime() > quizDateObj.getTime());

          if (isAfterQuiz) {
            cell.classList.add('disabled');
            cell.setAttribute('aria-disabled', 'true');
          }

          if (isQuiz) cell.classList.add('is-quiz');
          if (isReview) cell.classList.add('is-review');

          let badgeHtml = '';
          if (isQuiz && isReview) {
            badgeHtml = '<span class="cell-badge">QUIZ+REV</span>';
          } else if (isQuiz) {
            badgeHtml = '<span class="cell-badge">QUIZ</span>';
          } else if (isReview) {
            badgeHtml = '<span class="cell-badge">REV</span>';
          }

          cell.innerHTML = `<span>${day}</span>${badgeHtml}`;

          cell.addEventListener('click', () => {
            if (isAfterQuiz) return;

            if (activeMode === 'quiz') {
              quizDateStr = thisDateStr;

              const newQuizObj = parseYMD(quizDateStr);
              reviewDateStrs.forEach(revStr => {
                if (parseYMD(revStr).getTime() > newQuizObj.getTime()) {
                  reviewDateStrs.delete(revStr);
                }
              });

              setMode('review');
            } else {
              if (reviewDateStrs.has(thisDateStr)) {
                reviewDateStrs.delete(thisDateStr);
              } else {
                reviewDateStrs.add(thisDateStr);
              }
              renderCalendar();
            }

            evaluateReviewState();
          });

          calendarGrid.appendChild(cell);
        }
      }

      function evaluateReviewState() {
        statusPill.className = 'status-pill';

        if (!quizDateStr) {
          statusPill.classList.add('status-none');
          statusLabel.textContent = 'No review';
          statusDescription.textContent = "Please select the date Quiz #4 was conducted first.";
          selectedSummary.textContent = "Quiz date not selected";
          currentFormAnswer = 'No+Review';
          return;
        }

        const quizObj = parseYMD(quizDateStr);
        const reviewCount = reviewDateStrs.size;

        if (reviewCount === 0) {
          statusPill.classList.add('status-none');
          statusLabel.textContent = 'No review';
          statusDescription.textContent = "You did not study or prepare on any day before Quiz #4.";
          selectedSummary.textContent = `Quiz on ${quizDateStr} • 0 review days`;
          currentFormAnswer = 'No+Review';
          return;
        }

        const dayDiffs = Array.from(reviewDateStrs).map(revStr => {
          const revObj = parseYMD(revStr);
          const diffMs = quizObj.getTime() - revObj.getTime();
          return Math.round(diffMs / (1000 * 60 * 60 * 24));
        });

        const isStrictlyCramming = dayDiffs.every(diff => diff === 0 || diff === 1);

        if (isStrictlyCramming) {
          statusPill.classList.add('status-cramming');
          statusLabel.textContent = 'Cramming';
          statusDescription.textContent = "Studied only on the day of Quiz #4 or the immediate day before.";
          currentFormAnswer = 'Cram';
        } else if (reviewCount > 1) {
          statusPill.classList.add('status-spaced');
          statusLabel.textContent = 'Spaced out review';
          statusDescription.textContent = "Spread study sessions across multiple separate calendar dates.";
          currentFormAnswer = 'Spaced-out+Study';
        } else {
          statusPill.classList.add('status-block');
          statusLabel.textContent = 'Block review';
          statusDescription.textContent = "Did all studying in a single dedicated session earlier before the quiz.";
          currentFormAnswer = 'Block+Review';
        }

        selectedSummary.textContent = `Quiz on ${quizDateStr} • ${reviewCount} review day${reviewCount > 1 ? 's' : ''}`;
      }

      tabQuiz.addEventListener('click', () => setMode('quiz'));
      tabReview.addEventListener('click', () => setMode('review'));

      prevMonthBtn.addEventListener('click', () => {
        viewDate.setMonth(viewDate.getMonth() - 1);
        renderCalendar();
      });

      nextMonthBtn.addEventListener('click', () => {
        viewDate.setMonth(viewDate.getMonth() + 1);
        renderCalendar();
      });

      resetBtn.addEventListener('click', () => {
        quizDateStr = null;
        reviewDateStrs.clear();
        setMode('quiz');
        evaluateReviewState();
      });

      surveyBtn.addEventListener('click', () => {
        const finalUrl = `${FORM_BASE_URL}&${ENTRY_ID}=${currentFormAnswer}`;
        window.open(finalUrl, '_blank', 'noopener,noreferrer');
      });

      renderCalendar();
      evaluateReviewState();
    });
  </script>
</body>
</html>
